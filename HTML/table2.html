<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Invoice</h1>
    <table border="1" cellspacing="0" cellpadding="30">
        <thead>
            <tr>
                <th>No.</th>
                <th>Item</th>
                <th>Price</th>
                <th>Qty</th>
                <th>Amount</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <th>1</th>
                <th>Bubble</th>
                <th>12500</th>
                <th>1</th>
                <th>12500</th>
            </tr>
            <tr>
                <th>2</th>
                <th>closet</th>
                <th>12500</th>
                <th>1</th>
                <th>12500</th>
            </tr>
        </tbody>
        <tfoot>
            <tr>
                <th colspan="4">Total</th>
                <th>25000</th>
            </tr>
        </tfoot>
    </table>
    <h1>Saving Money</h1>
    <table border="1" cellspacing="0" cellpadding="30">
        <thead>
            <tr>
            <th>Months</th>
            <th>Save Money</th>
            <th>Total</th>
        </tr>
        </thead>
        <tbody>
            <tr>
            <td>Jan</td>
            <td>100000</td>
            <td rowspan="2">150000</td>
        </tr>
        <tr>
            <td>Feb</td>
            <td>50000</td>
        </tr>
        </tbody>
    </table>
</body>
</html>
