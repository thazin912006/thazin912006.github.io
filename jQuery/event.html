<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="jquery-4.0.0.min.js"></script>
    <style>
        .welcome{
            max-width: 250px;
            padding: 50px 0px;
            text-align: center;
            background-color: blueviolet;
            color: azure;
        }
    </style>
</head>
<body>
    <p id="my_class">Welcome to my class</p>
    <input type="text" name="name" id="name">

    <script>
        $(document).ready(function(){
            $('#my_class').mouseover(function(){
                $('this').addClass('welcome');
            })
            $('#my_class').mouseout(function(){
                $('this').removeClass('welcome');
            })
            $('#name').focus(function(){
                $('this').css({'background-color' : 'green'});
            })
             $('#name').change(function(){
                $('this').css({'background-color' : 'aqua'});
                let name = $('this').val(); 
                console.log(name);
            })
        })
    </script>
</body>
</html>
