<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="jquery-4.0.0.min.js"></script>
</head>
<body>
    <p>Hello this is jQuery effect lesson. You can learn show, hide , fade in /out /to and toogle effects.</p>
    <button id="hide">Hide</button>
    <button id="show">Show</button>
    <button id="toggle">Toggle</button>
    <button id="fadeout">Fade Out</button>
    <button id="fadein">Fade In</button>
    <button id="fadetoggle">Fade Toggle</button>
    <button id="fadeto">Fade To</button>
    <script>
        $(document).ready(function(){
            //hide effect
            $('#hide').click(function(){
                $('p').hide('slow');
            })
            //Show effect
            $('#show').click(function(){
                $('p').show('fast');
            }) 
            //Toggle effect
            $('#toggle').click(function(){
                $('p').toggle(3000);//3s
            }) 
            //fade out effect 
            $('#fadeout').click(function(){
                $('p').fadeOut(3000);
            }) 
            //fade in effect
            $('#fadein').click(function(){
                $('p').fadeIn(3000);
            })
            //fade toggle effect
            $('#fadetoggle').click(function(){
                $('p').fadeToggle(3000);
            })
            //fade to effect
            $('#fadeto').click(function(){
                $('p').fadeTo(3000,0.3);//(speed,opicity(0-1))
            })
            //fadeOrigin(3000,1);(speed,opicity(1))
        })
    </script>
</body>
</html>
