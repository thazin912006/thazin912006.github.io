    <title>Condition</title>
</head>
<body>
    <h1>Conditional Operator</h1>
    <script>
        //if statement
        let num = prompt("Enter a number");
        console.log(num);
        if(num < 10)
    {
        document.write("less than 10");
    }
    else if(num == 10)
    {
        document.write("equal to 10");
    }
    else{
        document.write("greater than 10");
    }
    </script>
</body>
