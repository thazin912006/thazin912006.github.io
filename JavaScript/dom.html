<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1 id="myId">Dom <i>Lecture</i> Lesson</h1>
    <p class="myClass">My Class 1</p>
    <p class="myClass">My Class 2</p>
    <p class="myClass">My Class 3</p>
    <script>
        //id selector
        let MyId = document.getElementById("myId");
        console.log(MyId);
        console.log(MyId.innerText);
        //document.write(MyId.innerText);
        console.log(MyId.innerHTML);
        // class selector
        let myclass = document.getElementsByClassName("myClass");
        console.log(myclass);
        console.log(myclass.innerText);
        document.write("<br>")
        document.write(myclass[1].innerText);
        console.log(myclass.innerHTML);
        //tag selector
        let mytag = document.getElementsByTagName("p");
        console.log(mytag);
        console.log(mytag.innerHTML);
        console.log(mytag.innerText);
        //Query Selector
        let myQuery = document.querySelector("#myId");
        console.log(myQuery.innerHTML);
        console.log(myQuery.innerText);
        let myQueryclass = document.querySelector(".myClass");
        console.log(myQueryclass.innerHTML);
        console.log(myQueryclass.innerText);
        //Query selector all for class and tag
        let myfav = document.querySelectorAll(".myClass")
        console.log(myfav);
        console.log(myfav[1].innerHTML);
        console.log(myfav[2].innerText);
    </script>
</body>
</html>
