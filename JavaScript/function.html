<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Function</h1>
    <script>
        function Greet(){
            document.write("Konnichiwa");
        }
        Greet();
        function Add(num1 , num2){
            let result = num1 + num2;
            document.write(` <br> The result of ${num1} and ${num2} is ${result}`);
        }
        Add(99,98);
        function Multi(num1 = 99, num2 = 90){
            let result = num1 * num2;
            document.write(`<br> The result is ${result}`);
        }
        Multi();
        Multi(97);
        Multi(95,94);
        function Div(num1 , num2){
            let result = num1 / num2;
            return result;
        }
        let Ans = Div(99 , 9);
        document.write(`<br> ${Ans}`);

    </script>
</body>
</html>
