<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        //String Data Type
        //let name = "Thazin";
        //let name = 'Thazin';
        let name = `Thazin`;
        console.log(name);
        console.log(typeof(name));
        //Numeric Data Type
        let age = 20;
        console.log(age);
        console.log(typeof(age));
        //Boolean Data Type
        let isStudent = true;
        console.log(isStudent);
        console.log(typeof(isStudent));
        //undefined Data Type
        let undefinedVariable;
        console.log(undefinedVariable);
        console.log(typeof(undefinedVariable));
        //null Data type
        let nullVariable = null;
        console.log(nullVariable);
        console.log(typeof(nullVariable));
        //array data type index start from 0
        //let studentList = new Array('Mg Mg', 'Ko Ko');
        let studentList = ['Mg Mg' , 'Ko Ko'];
        console.log(studentList);
        console.log(typeof(studentList));
        console.log(studentList[0]);

        //Object Data Type
        let student = {
            name : "Thazin",
            age : 20,
            address : "Insein, Yangon",
            education : "YTU",
        }
        console.log(student);
        console.log(typeof(student));
        console.log(student.education)
    </script>
</body>
</html>
