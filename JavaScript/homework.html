<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        for(let k = 5; k > 0; k--)
    {
        for(let v = 0; v < k; v++)
    {
        document.write(` * `);
    }
    document.write(`<br>`);
    }
    let mySecretNumber = 9;
    let yourNum = parseInt(prompt("Enter your number"));
    let count = 0;
    let i = 0;
    while(  i == 0)
    {
        let yourNum = parseInt(prompt("Enter your number"));
        document.write(yourNum)
        count++;
        document.write(count);
    
        if(yourNum == mySecretNumber)
    {
        i = 1;
        document.write(`You can guess the right answer, You Win`);
    }
    else{
        document.write("Finally, you can guess the right answer");
    }
    
    }
    
    </script>
</body>
</html>
