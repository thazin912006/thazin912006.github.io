<html lang="en">
<head>

    <title>String</title>

<body>
    <h1>String</h1>
    <script>
        //String Concatenation
        let firstName = "Thazin" ;
        let lastName = "CEIT";
        //let fullName = firstName + " " + lastName + " I'm 20 years old. "
       // let fullName = `${firstName} ${lastName} . I'm 20 years old.`

       document.write(fullName);
       document.write(fullName.toUpperCase());

        let num = '1,222,333,444,555,666,777';
