<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logical</title>
</head>
<body>
    <h1>Logical operator</h1>
    <script>
        //OR Operator
        let num1 = 10;
        let num2 = 20;
        console.log(num1 < num2 || num1 == num2);
        //And Operator
        console.log(num1 < num2 && num1 == num2);
        //Not Operator
        let num3 = 10;
        console.log(!num3);
    </script>
</body>
</html>
